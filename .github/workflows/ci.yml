name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint -- --max-warnings=0

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    name: Build extension bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verify required files in dist/ and dist-firefox/
        run: |
          for out in dist dist-firefox; do
            test -f $out/manifest.json
            test -f $out/background/service-worker.js
            test -f $out/content/content.js
            test -f $out/popup/popup.js
            test -f $out/popup/popup.html
          done
      - name: Lint the Firefox package
        run: npm run lint:firefox
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: parsipad-extension
          path: dist/
          retention-days: 14
      - name: Upload Firefox bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: parsipad-extension-firefox
          path: dist-firefox/
          retention-days: 14
