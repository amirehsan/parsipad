<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Lesson - ParsiPad</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="grammar.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white">

  <div class="grammar-container">
    <!-- Header -->
    <header class="grammar-header">
      <div class="header-left">
        <button id="back-btn" class="icon-btn" title="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <div class="logo-section">
          <img src="../icons/icon-48.png" alt="ParsiPad" class="logo-icon">
          <span class="logo-text" data-i18n="grammarLesson">Grammar Lesson</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="save-btn" class="icon-btn" title="Save lesson" data-i18n-title="saveLesson">
          <svg class="star-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          <svg class="star-filled" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" style="display: none;">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </button>
        <button id="theme-toggle" class="icon-btn" title="Toggle theme" data-i18n-title="toggleTheme">
          <svg class="sun-icon hidden dark:block" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
          </svg>
          <svg class="moon-icon block dark:hidden" fill="currentColor" viewBox="0 0 20 20">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Loading State with Skeleton UI -->
    <div id="loading-section" class="loading-section">
      <div class="skeleton-container">
        <!-- Source Card Skeleton -->
        <div class="skeleton-card skeleton-source">
          <div class="skeleton-row">
            <div class="skeleton-line skeleton-w-15"></div>
          </div>
          <div class="skeleton-line skeleton-w-80"></div>
          <div class="skeleton-row">
            <div class="skeleton-line skeleton-w-15"></div>
          </div>
          <div class="skeleton-line skeleton-w-70"></div>
        </div>

        <!-- Grammar Point Skeleton -->
        <div class="skeleton-card skeleton-grammar-point">
          <div class="skeleton-header">
            <div class="skeleton-circle"></div>
            <div class="skeleton-line skeleton-w-50"></div>
          </div>
          <div class="skeleton-content">
            <div class="skeleton-line skeleton-w-full"></div>
            <div class="skeleton-line skeleton-w-90"></div>
            <div class="skeleton-line skeleton-w-75"></div>
          </div>
          <div class="skeleton-examples">
            <div class="skeleton-line skeleton-w-60"></div>
            <div class="skeleton-line skeleton-w-70"></div>
          </div>
        </div>

        <!-- Second Grammar Point Skeleton (lighter) -->
        <div class="skeleton-card skeleton-grammar-point skeleton-fade">
          <div class="skeleton-header">
            <div class="skeleton-circle"></div>
            <div class="skeleton-line skeleton-w-40"></div>
          </div>
          <div class="skeleton-content">
            <div class="skeleton-line skeleton-w-85"></div>
            <div class="skeleton-line skeleton-w-65"></div>
          </div>
        </div>
      </div>
      <p class="loading-text" data-i18n="loadingLesson">Creating grammar lesson...</p>
    </div>

    <!-- Error State -->
    <div id="error-section" class="error-section" hidden>
      <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      <p id="error-message" class="error-text"></p>
      <button id="retry-btn" class="btn btn-secondary" data-i18n="tryAgain">Try Again</button>
    </div>

    <!-- Lesson Content -->
    <main id="lesson-content" class="lesson-content" hidden>
      <!-- Source Text Section -->
      <section class="source-section">
        <div class="source-card">
          <div class="source-row">
            <span class="source-label" data-i18n="original">Original</span>
            <div class="source-text-wrapper">
              <p id="original-text" class="source-text"></p>
              <button class="tts-btn" data-target="original" title="Listen" aria-label="Listen to original text" aria-pressed="false">
                <svg class="tts-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                  <path class="tts-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
                <svg class="tts-stop-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                  <rect x="6" y="6" width="12" height="12" rx="2"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="source-row">
            <span class="source-label" data-i18n="translation">Translation</span>
            <div class="source-text-wrapper">
              <p id="translation-text" class="source-text translation"></p>
              <button class="tts-btn" data-target="translation" title="Listen" aria-label="Listen to translation" aria-pressed="false">
                <svg class="tts-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                  <path class="tts-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
                <svg class="tts-stop-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                  <rect x="6" y="6" width="12" height="12" rx="2"/>
                </svg>
              </button>
            </div>
          </div>
          <span id="direction-badge" class="direction-badge">EN → FA</span>
        </div>
      </section>

      <!-- Grammar Points -->
      <section id="grammar-points-section" class="grammar-points-section">
        <!-- Grammar points will be dynamically inserted here -->
      </section>

      <!-- Related Patterns -->
      <section id="related-section" class="related-section" hidden>
        <h3 class="section-title">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          <span data-i18n="relatedPatterns">Related Patterns</span>
        </h3>
        <div id="related-tags" class="related-tags"></div>
      </section>
    </main>

    <!-- Save Notification -->
    <div id="save-notification" class="save-notification" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
      <span data-i18n="lessonSaved">Lesson saved to favorites!</span>
    </div>
  </div>

  <script type="module" src="grammar.js"></script>
</body>
</html>
